<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - ملتقى المهارات الناعمة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="deco deco-1"><i class="fa-solid fa-lock"></i></div>
    <div class="deco deco-2"><i class="fa-solid fa-shield-halved"></i></div>

    <div class="container py-5">
        
        <div id="loginScreen" class="card-custom active mx-auto" style="max-width: 500px;">
            <div class="text-center mb-4">
                <div class="icon-box mx-auto mb-3" style="width: 80px; height: 80px; font-size: 2rem;">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h2 class="fw-black">لوحة التحكم</h2>
                <p class="text-muted">أدخل كلمة المرور للوصول إلى البيانات</p>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">كلمة المرور</label>
                <input type="password" id="adminPassword" class="form-control-custom" placeholder="••••••••">
            </div>
            <button class="submit-btn w-100" id="loginBtn">
                <i class="fa-solid fa-right-to-bracket me-2"></i> دخول
            </button>
        </div>

        <div id="adminPanel" style="display: none;">
            
            <div class="header text-center mb-5">
                <span class="header-badge">
                    <i class="fa-solid fa-shield-halved me-2"></i> لوحة تحكم الإدارة
                </span>
                <h1 class="display-5 fw-black mt-3">إحصائيات <span class="text-pink">الملتقى</span></h1>
                <button class="btn btn-sm btn-outline-danger mt-3" id="logoutBtn">
                    <i class="fa-solid fa-right-from-bracket me-1"></i> تسجيل الخروج
                </button>
            </div>

            <div class="section-title">
                <span class="icon-box"><i class="fa-solid fa-file-lines"></i></span>
                الملخص التنفيذي للحدث
            </div>
            <div class="executive-summary card-custom active mb-4" id="executiveSummary"></div>

            <div class="section-title">
                <span class="icon-box"><i class="fa-solid fa-chart-pie"></i></span>
                الإحصائيات العامة
            </div>
            <div class="stats-grid mb-4" id="statsGrid"></div>

            <div class="section-title">
                <span class="icon-box"><i class="fa-solid fa-chart-simple"></i></span>
                تحليل NPS (صافي الترويج)
            </div>
            <div class="card-custom active mb-4" id="npsAnalysis" style="box-shadow: 5px 5px 0 var(--green);">
                <div id="npsChart"></div>
            </div>

            <div class="section-title">
                <span class="icon-box"><i class="fa-solid fa-chalkboard-user"></i></span>
                نتائج الجلسات والأساتذة
            </div>
            <div class="card-custom active mb-4" id="sessionsResults"></div>

            <div class="section-title">
                <span class="icon-box"><i class="fa-solid fa-comments"></i></span>
                جميع التغذية الراجعة
            </div>

            <div class="filters-bar mb-4">
                <input type="text" id="searchInput" class="form-control-custom" placeholder="🔍 ابحث في الردود...">
                <select id="filterRole" class="form-control-custom">
                    <option value="">كل الصفات</option>
                    <option value="طالب">طلاب</option>
                    <option value="أستاذ">أساتذة</option>
                    <option value="ضيف">ضيوف</option>
                </select>
                <select id="filterSession" class="form-control-custom">
                    <option value="">كل الجلسات</option>
                    <option value="session1">دور المهارات الناعمة</option>
                    <option value="session2">التسويق الإلكتروني</option>
                    <option value="session3">البراندينغ والهوية</option>
                    <option value="session4">فن اتخاذ القرار</option>
                    <option value="session5">التخطيط الاستراتيجي</option>
                    <option value="session6">الذكاء الاصطناعي</option>
                    <option value="session7">إدارة الفعاليات غير الربحية</option>
                    <option value="session8">إدارة الضغط النفسي</option>
                    <option value="session9">فن الإلقاء والخطابة</option>
                    <option value="other">أخرى</option>
                </select>
            </div>
            
            <div class="action-btns mb-4">
                <button class="action-btn btn-export" id="exportJsonBtn">
                    <i class="fa-solid fa-file-export me-2"></i> تصدير JSON
                </button>
                <button class="action-btn btn-export" id="exportCsvBtn" style="background: var(--purple);">
                    <i class="fa-solid fa-file-csv me-2"></i> تصدير CSV
                </button>
                <button class="action-btn btn-clear" id="clearDataBtn">
                    <i class="fa-solid fa-trash-can me-2"></i> مسح البيانات
                </button>
                <button class="action-btn btn-export" id="refreshBtn" style="background: var(--pink);">
                    <i class="fa-solid fa-rotate me-2"></i> تحديث
                </button>
            </div>

            <div id="feedbackList"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="js/script.js"></script>
</body>
</html>
